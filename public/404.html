<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Империя Гиперион</title>
    <script>
      // SPA-fallback для GitHub Pages: любой неизвестный путь ведёт на главную.
      // Работает и для user-сайта (корень), и для project-сайта (/Imperium_Hyperion/).
      var segs = location.pathname.split("/").filter(Boolean);
      var base = segs.length ? "/" + segs[0] + "/" : "/";
      location.replace(base + "index.html" + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=./index.html" />
  </head>
  <body style="background: #05070f; color: #e3b54a; font-family: monospace; text-align: center; padding-top: 20vh">
    Перенаправление в Империю Гиперион…
  </body>
</html>
